name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          echo "compileSdk platform: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEKO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEKO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEKO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEKO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing; falling back to the auto-generated debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/neko-demo.p12"
          {
            echo "NEKO_KEYSTORE_FILE=$RUNNER_TEMP/signing/neko-demo.p12"
            echo "NEKO_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NEKO_KEY_ALIAS=$KEY_ALIAS"
            echo "NEKO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Print release signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          grep -q "Signer #1 certificate SHA-256 digest" /tmp/certs.txt

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/neko-chat-1.0.0-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/neko-chat-1.0.0.apk"
          sha256sum out/*.apk | tee out/sha256.txt
          {
            echo "### Neko Chat build"
            echo ""
            echo '```'
            cat out/sha256.txt
            echo '```'
            echo ""
            echo '```'
            cat /tmp/certs.txt
            echo '```'
            echo ''
            echo 'Both APKs are signed with the project release key, so newer builds install over older ones.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neko-chat-1.0.0
          path: out/
          if-no-files-found: error
