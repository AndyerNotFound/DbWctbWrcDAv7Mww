name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the APKs to a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (defaults to v<versionName>)'
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      apk: ${{ steps.collect.outputs.apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read version from Gradle
        id: version
        run: |
          NAME=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Neko Chat $NAME ($CODE)"

      - name: Ensure Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          echo "compileSdk platform: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEKO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEKO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEKO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEKO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing; falling back to the auto-generated debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/neko-demo.p12"
          {
            echo "NEKO_KEYSTORE_FILE=$RUNNER_TEMP/signing/neko-demo.p12"
            echo "NEKO_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NEKO_KEY_ALIAS=$KEY_ALIAS"
            echo "NEKO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Print release signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          grep -q "Signer #1 certificate SHA-256 digest" /tmp/certs.txt

      - name: Collect APKs
        id: collect
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/neko-chat-$VERSION_NAME-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/neko-chat-$VERSION_NAME.apk"
          sha256sum out/*.apk | tee out/sha256.txt
          echo "apk=out/neko-chat-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"
          {
            echo "### Neko Chat $VERSION_NAME"
            echo ""
            echo '```'
            cat out/sha256.txt
            echo '```'
            echo ""
            echo '```'
            cat /tmp/certs.txt
            echo '```'
            echo ''
            echo 'Both APKs are signed with the project release key, so newer builds install over older ones.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-chat-${{ steps.version.outputs.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: neko-chat-${{ needs.build.outputs.version_name }}
          path: out

      - name: Resolve tag
        id: tag
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$VERSION_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Write release notes
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          SHA=$(grep "neko-chat-$VERSION_NAME.apk" out/sha256.txt | awk '{print $1}')
          {
            echo "Neko Chat $VERSION_NAME (versionCode $VERSION_CODE) — Material 3 XML demo."
            echo ""
            echo "### Sidebar"
            echo "- The leading control is a collapse chevron, and the panel title is Neko Chat."
            echo "- Quick actions are a fixed vertical column: one full width outlined button per row."
            echo "- Chat history scrolls on its own under the pinned quick actions."
            echo "- Each day group is a card that grows into its own page with a Material container transform fragment transition, and shrinks back onto the card when it closes."
            echo "- Opening the panel and closing it with the collapse control both use the shared axis X activity transition, so the panel enters and leaves on the left instead of sliding out to the right."
            echo ""
            echo "### Settings"
            echo "- The bottom left FAB opens Settings, and every settings page is pushed with the shared axis X activity transition."
            echo ""
            echo "### Install"
            echo "- Min Android 8.0 (API 26), built for API 36."
            echo "- Signed with the project key, so it installs straight over older builds."
            echo "- SHA-256 of \`neko-chat-$VERSION_NAME.apk\`: \`$SHA\`"
            echo ""
            echo "Compiled and packaged by GitHub Actions."
          } > release-notes.md
          cat release-notes.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Neko Chat ${{ needs.build.outputs.version_name }}
          body_path: release-notes.md
          files: |
            out/neko-chat-${{ needs.build.outputs.version_name }}.apk
            out/sha256.txt
          fail_on_unmatched_files: true
          make_latest: true
