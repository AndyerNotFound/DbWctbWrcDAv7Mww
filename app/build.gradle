plugins {
    id 'com.android.application'
}

// A stable signing key keeps every CI build installable over the previous one. The keystore is
// restored from repository secrets; when it is absent (local builds, forks) we fall back to the
// auto-generated debug key.
def keystorePath = System.getenv("NEKO_KEYSTORE_FILE")
def keystoreFile = keystorePath ? file(keystorePath) : null
def hasStableKey = keystoreFile != null && keystoreFile.exists()

android {
    namespace 'dev.neko.chatdemo'
    compileSdk 36

    defaultConfig {
        applicationId "dev.neko.chatdemo"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.1.1"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            if (hasStableKey) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("NEKO_STORE_PASSWORD")
                keyAlias System.getenv("NEKO_KEY_ALIAS") ?: "neko-demo"
                keyPassword System.getenv("NEKO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
